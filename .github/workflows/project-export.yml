name: Project Export

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: Prefix applied to uploaded build artifacts
        required: false
        type: string
        default: project

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1

jobs:
  export:
    name: Export / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            preset: Windows Desktop
            export_mode: --export-release
            output: build/windows/Konado Project.exe
            artifact_path: build/windows
          - target: linux
            preset: Linux
            export_mode: --export-release
            output: build/linux/Konado Project.x86_64
            artifact_path: build/linux
          - target: web
            preset: Web
            export_mode: --export-release
            output: build/web/index.html
            artifact_path: build/web
          - target: android-arm64
            preset: Android
            export_mode: --export-debug
            output: build/android/Konado Project-arm64.apk
            artifact_path: build/android

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 libfontconfig1

      - name: Install export templates
        shell: bash
        run: |
          source_dir="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          target_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          source_config="/root/.config/godot"
          target_config="$HOME/.config/godot"
          mkdir -p "$(dirname "$target_dir")"
          if [ "$source_dir" != "$target_dir" ]; then
            mv "$source_dir" "$target_dir"
          fi
          if [ "$source_config" != "$target_config" ] && [ -d "$source_config" ]; then
            mkdir -p "$(dirname "$target_config")"
            mv "$source_config" "$target_config"
          fi
          test -d "$target_dir"

      - name: Export project
        shell: bash
        run: |
          output="${{ matrix.output }}"
          mkdir -p "$(dirname "$output")"
          python3 .github/scripts/run_godot_export.py \
            --cleanup "$(dirname "$output")" \
            -- \
            godot --headless --verbose \
              ${{ matrix.export_mode }} \
              "${{ matrix.preset }}" \
              "$output"

      - name: Verify encrypted KS export
        if: matrix.target == 'linux'
        shell: bash
        run: |
          verification_pack="build/linux/konado-script-protection.pck"
          verification_log="$(mktemp)"
          expected_script_paths="$(
            find sample -type f -name '*.ks' -print | sort | paste -sd ';' -
          )"
          python3 .github/scripts/run_godot_export.py \
            --cleanup "$verification_pack" \
            -- \
            godot --headless \
              --export-pack "${{ matrix.preset }}" "$verification_pack" \
            | tee "$verification_log"
          grep -Fq "已复用预设剧本密钥" "$verification_log"
          verification_workdir="$(mktemp -d)"
          (
            cd "$verification_workdir"
            KONADO_EXPECTED_KS_PATHS="$expected_script_paths" \
              python3 "$GITHUB_WORKSPACE/.github/scripts/run_godot_export.py" \
                -- \
                godot --headless \
                  --main-pack "$GITHUB_WORKSPACE/$verification_pack" \
                  --script \
                    "$GITHUB_WORKSPACE/tests/dialogue/test_exported_script_protection.gd"
          )
          find "$verification_workdir" -type f -delete
          rmdir "$verification_workdir"
          rm -f "$verification_pack" "$verification_log"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
