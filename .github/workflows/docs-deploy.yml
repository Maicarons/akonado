name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/generate-konado-case.mjs"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-deploy.yml"
      - ".github/workflows/update-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    uses: ./.github/workflows/docs-build.yml

  update-showcase:
    name: Update showcase
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/update-showcase.yml

  deploy:
    name: Deploy docs branch
    needs: [build, update-showcase]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: vitepress-site
          path: site

      - name: Publish docs branch
        shell: bash
        env:
          DOCS_BRANCH: docs
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/konado-docs-branch"
          remote_sha="$(git ls-remote --heads origin "$DOCS_BRANCH" | awk '{print $1}')"

          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/heads/$DOCS_BRANCH:refs/remotes/origin/$DOCS_BRANCH"
            git worktree add --detach "$deploy_dir" "origin/$DOCS_BRANCH"
          else
            git worktree add --detach "$deploy_dir" HEAD
          fi

          cd "$deploy_dir"
          git switch --orphan docs-deploy
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/site/." .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: deploy ${GITHUB_SHA::8}"

          if [ -n "$remote_sha" ]; then
            git push origin HEAD:"$DOCS_BRANCH" \
              --force-with-lease="refs/heads/$DOCS_BRANCH:$remote_sha"
          else
            git push origin HEAD:"$DOCS_BRANCH"
          fi
