name: Release

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-build:
    name: Build release targets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'create' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v')
      )
    uses: ./.github/workflows/project-export.yml
    with:
      artifact_prefix: release

  package-plugins:
    name: Package plugins
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'create' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            version="manual-${GITHUB_SHA::8}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create plugin archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/konado-plugin-packages"
          mkdir -p "$staging/konado" "$staging/konado_dotnet" build/plugins
          cp -a addons/konado/. "$staging/konado/"
          cp -a addons/konado_dotnet/. "$staging/konado_dotnet/"
          cp LICENSE "$staging/konado/"
          cp LICENSE "$staging/konado_dotnet/"
          (
            cd "$staging"
            zip -9 -r "$GITHUB_WORKSPACE/build/plugins/konado-${VERSION}.zip" konado
            zip -9 -r "$GITHUB_WORKSPACE/build/plugins/konado-dotnet-${VERSION}.zip" konado_dotnet
          )

      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: release-plugins
          path: build/plugins/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: >-
      github.event_name == 'create' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [project-build, package-plugins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: downloaded

      - name: Prepare release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              if (capturing) {
                exit
              }
              if ($2 == version) {
                capturing = 1
              }
            }
            capturing {
              print
              if ($0 !~ /^[[:space:]]*$/) {
                content_lines++
              }
            }
            END {
              if (!capturing || content_lines < 2) {
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          cp "downloaded/release-windows/Konado Project.exe" \
            "upload/konado-${version}-windows.exe"
          cp "downloaded/release-linux/Konado Project.x86_64" \
            "upload/konado-${version}-linux.x86_64"
          cp "downloaded/release-android-arm64/Konado Project-arm64.apk" \
            "upload/konado-${version}-android-arm64.apk"
          (
            cd downloaded/release-web
            zip -9 -r "$GITHUB_WORKSPACE/upload/konado-${version}-web.zip" .
          )
          cp downloaded/release-plugins/*.zip upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: upload/*
